steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_SOURCE_REVISION}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_SOURCE_REVISION}

substitutions:
  _REGION: europe-west1
  _REPOSITORY: atlas
  _SERVICE: atlas-market
  _SOURCE_REVISION: unverified-source

options:
  logging: CLOUD_LOGGING_ONLY
