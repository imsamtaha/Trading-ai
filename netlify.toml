[build]
  publish = "web"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://s3.tradingview.com/external-embedding/; frame-src https://www.tradingview-widget.com; style-src 'self'; img-src 'self'; connect-src https://dursjyqvrquapwwtkhoc.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

[[redirects]]
  from = "/traders"
  to = "/#market-analysis"
  status = 308
