# Trading Hub MVP configuration
# Live-money execution remains disabled until validation is complete.

app:
  name: "Trading Hub"
  environment: "development"
  live_execution: false

symbols:
  primary:
    - XAUUSD
    - XAGUSD
    - EURUSD
    - GAS
  crypto:
    - BTCUSDT
    - XRPUSDT
    - SOLUSDT

timeframes:
  execution: [5m, 15m, 30m, 1h]
  higher_context: [1h]

monitor:
  refresh_seconds: 10
  candle_limit: 200

risk:
  max_daily_loss_percent: 2.0
  max_risk_per_trade_percent: 1.0
  max_leverage: 5.0
  stop_loss_atr: 1.5
  take_profit_atr: 2.5

execution:
  mode: paper
  mt5:
    enabled: true
    dry_run: true
    magic_number: 260830
