name: ATLAS Unified Setup & Council Gate

on:
  push:
    branches: [ main, feat/atlas-council-consensus ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  ATLAS_CI_DRY_RUN: "true"
  MT5_READONLY_MODE: "true"
  ATLAS_LIVE_TRADING: "false"
  ATLAS_DASHBOARD_ONLY: "true"
  ATLAS_AGENT_PAPER_EXECUTION_ENABLED: "false"
  MT5_REQUIRE_DEMO: "true"
  ATLAS_ENVIRONMENT: "paper"

jobs:
  atlas-council-verification:
    name: Verify Council Gates & Unified Cockpit
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install dependencies using platform markers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pip install pydantic google-genai pytest

      - name: 4. Validate Council Thresholds Schema
        run: |
          python src/council/consensus_aggregator.py

      - name: 5. Run Consensus Aggregator & Risk Veto Dry-Run
        run: |
          python -m pytest tests/test_council_consensus_safety.py tests/test_council_observed_calibration.py -q

      - name: 6. Run Unified Cockpit & Billing Tests
        run: |
          python -m pytest tests/ -v --maxfail=1 --disable-warnings

  windows-council-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Validate Windows setup and failure handling
        shell: powershell
        run: |
          .\ATLAS_COUNCIL_INSTALL.ps1 -Python python
          if ($LASTEXITCODE -ne 0) { throw 'Council setup failed' }
          python -m pytest tests/test_council_installer.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression tests failed' }
