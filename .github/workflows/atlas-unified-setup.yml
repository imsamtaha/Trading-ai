name: ATLAS Unified Setup & Council Gate

on:
  push:
    branches: [ main, feat/atlas-council-consensus ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  ATLAS_CI_DRY_RUN: "true"
  MT5_READONLY_MODE: "true"

jobs:
  atlas-council-verification:
    name: Verify Council Gates & Unified Cockpit
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Dependencies (Ignore Windows-only MT5 binary on Linux CI)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            grep -v -i "MetaTrader5" requirements.txt > requirements_ci.txt
            pip install -r requirements_ci.txt
          fi
          pip install pydantic google-genai pytest

      - name: 4. Validate Council Thresholds Schema
        run: |
          python -c "
          import json, sys
          with open('config/council_role_thresholds.json') as f:
              data = json.load(f)
          required = {'MOMENTUM', 'MEAN_REVERSION', 'NEWS_SENTIMENT', 'RISK_MANAGER'}
          missing = required - set(data.get('roles', {}).keys())
          if missing:
              print(f'Missing roles: {missing}')
              sys.exit(1)
          print('Council role thresholds JSON verified successfully.')
          "

      - name: 5. Run Consensus Aggregator & Risk Veto Dry-Run
        run: |
          if [ -f src/council/consensus_aggregator.py ]; then
            python src/council/consensus_aggregator.py
          fi

      - name: 6. Run Unified Cockpit & Billing Tests
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --maxfail=1 --disable-warnings
          else
            echo "No additional pytest directory found; core council checks passed."
          fi
